name: NoticeConnect
version: '${version}'
main: com.noticemc.noticeconnect.paper.NoticeConnectPaper
api-version: '1.20'
description: Login, Left Message
permissions:
  noticeconnect.hide.left:
    description: Hide leave messages for the player
    default: false
  noticeconnect.hide.join:
    description: Hide join messages for the player
    default: false
  noticeconnect.reload:
    description: Reload NoticeConnect configuration
    default: op
  noticeconnect.message:
    description: Send broadcast messages
    default: op
