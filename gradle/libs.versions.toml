[versions]
kotlin = "2.3.20"
serialization = "1.11.0"
typesafe = "1.4.3"
adventure = "4.19.0"
sqlite = "3.49.1.0"
lamp = "3.3.5"
velocity = "3.4.0-SNAPSHOT"
paper = "1.21.4-R0.1-SNAPSHOT"
shadow = "8.3.6"
commons-lang = "3.17.0"
configurate = "4.2.0"
exposed = "1.6.0"

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8" }
typesafe-config = { group = "com.typesafe", name = "config", version.ref = "typesafe" }
kotlinx-serialization-hocon = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-hocon", version.ref = "serialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-gson = { group = "net.kyori", name = "adventure-text-serializer-gson", version.ref = "adventure" }
adventure-legacy = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
lamp-common = { group = "com.github.Revxrsal.Lamp", name = "common", version.ref = "lamp" }
lamp-velocity = { group = "com.github.Revxrsal.Lamp", name = "velocity", version.ref = "lamp" }
lamp-bukkit = { group = "com.github.Revxrsal.Lamp", name = "bukkit", version.ref = "lamp" }
velocity-api = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commons-lang" }
configurate-hocon = { group = "org.spongepowered", name = "configurate-hocon", version.ref = "configurate" }
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-migration-jdbc = { group = "org.jetbrains.exposed", name = "exposed-migration-jdbc", version.ref = "exposed" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version = "2.0.16" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version = "2.0.16" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[bundles]
adventure = ["adventure-api", "adventure-minimessage", "adventure-gson", "adventure-legacy"]
serialization = ["kotlinx-serialization-hocon", "kotlinx-serialization-json"]
exposed = ["exposed-core", "exposed-jdbc", "exposed-migration-jdbc"]
